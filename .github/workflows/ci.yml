name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Shell scripts parse
        run: for f in app/*.sh scripts/*.sh startup/*.sh; do sh -n "$f"; done
      - name: Unit tests on the device's CPU (ARMv7, under qemu)
        run: |
          # qemu-user-static on older images, qemu-user on newer ones
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || sudo apt-get install -y -qq qemu-user >/dev/null
          qemu=$(command -v qemu-arm-static || command -v qemu-arm)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go test -exec "$qemu" ./...
      - name: The app folder is complete
        run: |
          for f in config.json launch.sh icon.png; do [ -f "app/$f" ] || { echo "missing app/$f"; exit 1; }; done
          python3 -m json.tool app/config.json > /dev/null
      - name: Release build and package
        run: |
          VERSION=0.0.0-ci ./scripts/build.sh && ./scripts/package.sh 0.0.0-ci
          python3 -m json.tool dist/app.json > /dev/null
